<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e6e6e6;
            padding: 40px;
        }

        .container {
            background: #ffffff;
            max-width: 900px;
            margin: auto;
            padding: 40px;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            margin: 20px 0;
        }

        .intro {
            text-align: center;
            color: #555;
            margin-bottom: 40px;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #ccc;
        }

        .details {
            max-width: 500px;
        }

        .lists {
            display: flex;
            gap: 80px;
            margin-top: 30px;
        }

        ul {
            margin-left: 20px;
        }

        .social {
            margin-top: 40px;
        }

        .social a {
            margin-right: 15px;
            text-decoration: none;
            color: #0066cc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Thitikon</h1>
        <div class="profile">
            <img src="khem.jpg" alt="Profile Picture">

            <div class="details">
                <p>
                    สวัสดีครับ ผมชื่อ ฐิติกรณ์ จันทร์นวล กำลังศึกษาอยู่ มหาวิทยาลัย สงขลสนคริทร์ วิทยาเขต สุราฎร์ธานี ชั้นปีที่ 2 สาขาเทคโนโลยีสารสนดเทศ
                </p>
            </div>
        </div>
        <div class="lists">
            <div>
                <h3>ความสนใจ:</h3>
                <ul>
                    <li>Coding</li>
                    <li>Reading</li>
                    <li>Hiking</li>
                </ul>
            </div>

            <div>
                <h3>ทักษะ</h3>
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>JavaScript</li>
                </ul>
            </div>
        </div>

        <!-- Social Links -->
        <div class="social">
            <h3>โซเชียลมิเดีย</h3>
            <a href="https://www.youtube.com">youtube</a>
            <a href="https://www.facebook.com/">facebook</a>
            <a href="https://github.com/">GitHub</a>
        </div>

    </div>

</body>
</html>
